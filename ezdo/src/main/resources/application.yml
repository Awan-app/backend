server:
  port: 8080

spring:
  application:
    name: ezdo
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/ezdo}
    username: ${SPRING_DATASOURCE_USERNAME:ezdo}
    password: ${SPRING_DATASOURCE_PASSWORD:ezdo}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  ai:
    openai:
      api-key: ${SPRING_OPENAI_API_KEY:}
      base-url: ${SPRING_OPENAI_BASE_URL:https://opencode.ai/zen/v1}
      chat:
        model: ${SPRING_OPENAI_CHAT_MODEL:deepseek-v4-flash-free}
        temperature: ${SPRING_OPENAI_CHAT_TEMPERATURE:0.4}
    google:
      genai:
        api-key: ${SPRING_GENAI_API_KEY:}
        chat:
          model: ${SPRING_GENAI_CHAT_MODEL:gemini-3.5-flash-lite}
          temperature: ${SPRING_GENAI_CHAT_TEMPERATURE:0.4}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

ezdo:
  jwt:
    secret: ${EZDO_JWT_SECRET:default-dev-secret-change-in-production-32chars!}
    access-token-expiry-seconds: 86400
  otp:
    pepper: ${EZDO_OTP_PEPPER:default-dev-pepper-change-in-production!}
    expiry-seconds: 300
    resend-cooldown-seconds: 30
    max-attempts: 5
    rate-limit-max: 3
    rate-limit-window-minutes: 10
  refresh-token:
    expiry-days: 30
  firebase:
    # Firebase project ID — also the audience of the ID tokens it mints. Public value,
    # not a secret. Leave empty to disable Google sign-in.
    project-id: ${EZDO_FIREBASE_PROJECT_ID:}
    # Guard rail: only providers deliberately enabled in the Firebase console may mint a session.
    # Comma-separated Firebase sign_in_provider values, e.g. google.com,apple.com.
    allowed-sign-in-providers: ${EZDO_FIREBASE_ALLOWED_PROVIDERS:google.com,apple.com}
  mail:
    from: ${EZDO_MAIL_FROM:noreply@awan.com}
  ai:
    max-turns: ${EZDO_AI_MAX_TURNS:20}
    plan:
      max-tasks: ${EZDO_AI_PLAN_MAX_TASKS:25}
      max-sessions-per-task: ${EZDO_AI_PLAN_MAX_SESSIONS:10}
      availability-horizon-days: ${EZDO_AI_PLAN_HORIZON_DAYS:14}
  cors:
    # Comma-separated browser origins allowed to call /api/**. Origin = scheme + host + port,
    # with no trailing slash. Wildcards are not supported — list each origin explicitly.
    # Dev defaults: Angular CLI (4200), Next/CRA (3000), Vite (5173).
    allowed-origins: ${EZDO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}

  cloudinary:
    cloud-name: ${EZDO_CLOUDINARY_CLOUD_NAME:}
    api-key: ${EZDO_CLOUDINARY_API_KEY:}
    api-secret: ${EZDO_CLOUDINARY_API_SECRET:}

timefold:
  solver:
    termination:
      spent-limit: 5s
