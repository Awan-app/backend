server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://awan-auth-server-production.up.railway.app/realms/awan}
  application:
    name: ezdo
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS:false}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/ezdo}
    username: ${SPRING_DATASOURCE_USERNAME:ezdo}
    password: ${SPRING_DATASOURCE_PASSWORD:ezdo}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

  quartz:
    job-store-type: jdbc  # persist jobs/triggers in the DB instead of memory
    jdbc:
      initialize-schema: always     # auto-creates Quartz's tables on startup
    properties:
      org:
        quartz:
          scheduler:
            instanceName: EzdoScheduler
            instanceId: AUTO                      # needed even for a single instance, harmless if we scale later
          threadPool:
            class: org.quartz.simpl.SimpleThreadPool
            threadCount: 10
            threadPriority: 5
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore   # class: org.springframework.scheduling.quartz.LocalDataSourceJobStore

            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            tablePrefix: QRTZ_
            isClustered: false                     # true only if we run multiple app instances later
            misfireThreshold: 60000

  ai:
    mcp:
      server:
        name: ezdo
        version: 1.0.0
        protocol: STREAMABLE
        # By default, Spring AI MCP Starter configures an SSE endpoint at /mcp/sse
    openai:
      api-key: ${SPRING_OPENAI_API_KEY:}
      base-url: ${SPRING_OPENAI_BASE_URL:https://opencode.ai/zen/v1}
      chat:
        model: ${SPRING_OPENAI_CHAT_MODEL:deepseek-v4-flash-free}
        temperature: ${SPRING_OPENAI_CHAT_TEMPERATURE:0.4}
    google:
      genai:
        api-key: ${SPRING_GENAI_API_KEY:}
        chat:
          model: ${SPRING_GENAI_CHAT_MODEL:gemini-3.5-flash-lite}
          temperature: ${SPRING_GENAI_CHAT_TEMPERATURE:0.4}
        embedding:
          api-key: ${SPRING_GENAI_API_KEY:}
          text:
            model: text-embedding-004
#    vectorstore:
#      qdrant:
#        host: localhost
#        port: 6334
#        collection-name: ezdo-memory

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE

ezdo:
  keycloak:
    issuer-uri: ${KEYCLOAK_ISSUER_URI:https://awan-auth-server-production.up.railway.app/realms/awan}
    admin-url: ${KEYCLOAK_ADMIN_URL:https://awan-auth-server-production.up.railway.app}
    realm: ${KEYCLOAK_REALM:awan}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
    admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  jwt:
    secret: ${EZDO_JWT_SECRET:default-dev-secret-change-in-production-32chars!}
    access-token-expiry-seconds: 86400
  otp:
    pepper: ${EZDO_OTP_PEPPER:default-dev-pepper-change-in-production!}
    expiry-seconds: 300
    resend-cooldown-seconds: 30
    max-attempts: 5
    rate-limit-max: 3
    rate-limit-window-minutes: 10
  refresh-token:
    expiry-days: 30
  firebase:
    credentials-json: ${EZDO_FIREBASE_CREDENTIALS_JSON:}
    service-account-path: ${EZDO_FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}
    project-id: ${EZDO_FIREBASE_PROJECT_ID:}
    allowed-sign-in-providers: ${EZDO_FIREBASE_ALLOWED_PROVIDERS:google.com,apple.com}
  mail:
    from: ${EZDO_MAIL_FROM:noreply@awan.com}
  ai:
    max-turns: ${EZDO_AI_MAX_TURNS:20}
    plan:
      max-tasks: ${EZDO_AI_PLAN_MAX_TASKS:25}
      max-sessions-per-task: ${EZDO_AI_PLAN_MAX_SESSIONS:10}
      availability-horizon-days: ${EZDO_AI_PLAN_HORIZON_DAYS:14}
  cors:
    allowed-origins: ${EZDO_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:3000,http://localhost:5173}

  cloudinary:
    cloud-name: ${EZDO_CLOUDINARY_CLOUD_NAME:}
    api-key: ${EZDO_CLOUDINARY_API_KEY:}
    api-secret: ${EZDO_CLOUDINARY_API_SECRET:}

  mcp:
    base-url: ${EZDO_MCP_BASE_URL:}
    client-id: ${EZDO_MCP_CLIENT_ID:awan-mcp}

timefold:
  solver:
    termination:
      spent-limit: 5s
