
services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${BACKEND_DATABASE_NAME:-ezdo}
      MYSQL_USER: ${BACKEND_DATABASE_USER:-ezdo}
      MYSQL_PASSWORD: ${BACKEND_DATABASE_PASSWORD:-ezdo}
      MYSQL_ROOT_PASSWORD: ${BACKEND_DATABASE_ROOT_PASSWORD:-ezdo}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ezdo
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${BACKEND_DATABASE_NAME:-ezdo}?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${BACKEND_DATABASE_USER:-ezdo}
      SPRING_DATASOURCE_PASSWORD: ${BACKEND_DATABASE_PASSWORD:-ezdo}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-false}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-false}

      # AI (OpenAI-compatible — defaults to Groq with llama-3.3-70b)
      SPRING_OPENAI_API_KEY: ${SPRING_OPENAI_API_KEY}
      SPRING_OPENAI_BASE_URL: ${SPRING_OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      SPRING_OPENAI_CHAT_MODEL: ${SPRING_OPENAI_CHAT_MODEL:-llama-3.3-70b-versatile}
      SPRING_OPENAI_CHAT_TEMPERATURE: ${SPRING_OPENAI_CHAT_TEMPERATURE:-0.4}

      # EZDO-specific settings
      EZDO_JWT_SECRET: ${EZDO_JWT_SECRET}
      EZDO_OTP_PEPPER: ${EZDO_OTP_PEPPER}
      EZDO_MAIL_FROM: ${EZDO_MAIL_FROM:-noreply@awan.com}
      EZDO_AI_MAX_TURNS: ${EZDO_AI_MAX_TURNS:-20}

#
#      SPRING_AI_VECTORSTORE_QDRANT_HOST: qdrant
#      SPRING_AI_VECTORSTORE_QDRANT_PORT: 6334
#      SPRING_AI_VECTORSTORE_QDRANT_COLLECTION_NAME: ezdo-memory

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  qdrant:
   image: qdrant/qdrant:latest
   container_name: qdrant
   restart: unless-stopped
   ports:
     - "6333:6333"
     - "6334:6334"
   volumes:
     - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  qdrant_data:
