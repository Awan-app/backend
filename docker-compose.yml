
services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${BACKEND_DATABASE_NAME:-ezdo}
      MYSQL_USER: ${BACKEND_DATABASE_USER:-ezdo}
      MYSQL_PASSWORD: ${BACKEND_DATABASE_PASSWORD:-ezdo}
      MYSQL_ROOT_PASSWORD: ${BACKEND_DATABASE_ROOT_PASSWORD:-ezdo}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ezdo
      dockerfile: Dockerfile
    container_name: app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${BACKEND_DATABASE_NAME:-ezdo}?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: ${BACKEND_DATABASE_USER:-ezdo}
      SPRING_DATASOURCE_PASSWORD: ${BACKEND_DATABASE_PASSWORD:-ezdo}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-mailpit}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-1025}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-false}
      SPRING_MAIL_STARTTLS: ${SPRING_MAIL_STARTTLS:-false}

      # AI (OpenAI-compatible — defaults to Groq with llama-3.3-70b)
      SPRING_OPENAI_API_KEY: ${SPRING_OPENAI_API_KEY}
      SPRING_OPENAI_BASE_URL: ${SPRING_OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      SPRING_OPENAI_CHAT_MODEL: ${SPRING_OPENAI_CHAT_MODEL:-llama-3.3-70b-versatile}
      SPRING_OPENAI_CHAT_TEMPERATURE: ${SPRING_OPENAI_CHAT_TEMPERATURE:-0.4}

      # AI (Google GenAI — the vision model behind /api/v1/ai/image-to-tasks).
      # Required: the app fails to start without a key.
      SPRING_GENAI_API_KEY: ${SPRING_GENAI_API_KEY}
      SPRING_GENAI_CHAT_MODEL: ${SPRING_GENAI_CHAT_MODEL:-gemini-2.5-flash}
      SPRING_GENAI_CHAT_TEMPERATURE: ${SPRING_GENAI_CHAT_TEMPERATURE:-0.4}

      # EZDO-specific settings
      EZDO_JWT_SECRET: ${EZDO_JWT_SECRET}
      EZDO_OTP_PEPPER: ${EZDO_OTP_PEPPER}
      # Firebase project ID for Google sign-in. Leave unset to disable it.
      EZDO_FIREBASE_PROJECT_ID: ${EZDO_FIREBASE_PROJECT_ID:-}
      # Firebase sign_in_provider values allowed to mint a session, comma-separated.
      EZDO_FIREBASE_ALLOWED_PROVIDERS: ${EZDO_FIREBASE_ALLOWED_PROVIDERS:-google.com,apple.com}

      EZDO_FIREBASE_CREDENTIALS_JSON: ${EZDO_FIREBASE_CREDENTIALS_JSON:-}
      EZDO_FIREBASE_SERVICE_ACCOUNT_PATH: ${EZDO_FIREBASE_SERVICE_ACCOUNT_PATH:-}
      # Browser origins allowed to call the API, comma-separated. Set this to your web app's
      # real origin in production — the default only covers local dev servers.
      EZDO_CORS_ALLOWED_ORIGINS: ${EZDO_CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      EZDO_MAIL_FROM: ${EZDO_MAIL_FROM:-noreply@awan.com}
      EZDO_AI_MAX_TURNS: ${EZDO_AI_MAX_TURNS:-20}
      EZDO_AI_PLAN_MAX_TASKS: ${EZDO_AI_PLAN_MAX_TASKS:-25}
      EZDO_AI_PLAN_MAX_SESSIONS: ${EZDO_AI_PLAN_MAX_SESSIONS:-10}
      EZDO_AI_PLAN_HORIZON_DAYS: ${EZDO_AI_PLAN_HORIZON_DAYS:-14}

      # Cloudinary (profile pictures)
      EZDO_CLOUDINARY_CLOUD_NAME: ${EZDO_CLOUDINARY_CLOUD_NAME}
      EZDO_CLOUDINARY_API_KEY: ${EZDO_CLOUDINARY_API_KEY}
      EZDO_CLOUDINARY_API_SECRET: ${EZDO_CLOUDINARY_API_SECRET}

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  keycloak-db:
    image: mysql:8.4
    container_name: keycloak-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD:-keycloak}
    volumes:
      - keycloak_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db:
        condition: service_healthy
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_HTTP_PORT: 9090
      KC_HOSTNAME_STRICT: false
    ports:
      - "9090:9090"

volumes:
  mysql_data:
  keycloak_db_data:
